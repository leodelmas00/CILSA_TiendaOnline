<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="contact.css">
    <title>Contacto</title>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navigation bar -->

    <nav class="navbar navbar-expand-lg sticky-top bg-body-tertiary px-5 shadow">
        <div class="container-fluid">
            
            <a class="navbar-brand" href="index.html">TiendaOnline</a>

            <!-- Botón hamburguesa -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Contenido colapsable -->
            <div class="collapse navbar-collapse" id="navbarContenido">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contacto</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- Sección formulario -->

    <main class="container flex-grow-1 d-flex justify-content-center align-items-center py-5">

        <div class="contact-card shadow">

            <h1 class="text-center mb-4">Contacto</h1>

            <form>

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" required>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="mensaje" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn btn-custom w-100">
                    Enviar
                </button>

            </form>

        </div>

    </main>

    <!-- Seccion footer -->

    <footer class="bg-body-tertiary text-center py-3 mt-auto">
        <div class="container">
            <span class="text-muted">
                © 2026 TiendaOnline | Todos los derechos reservados
            </span>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
